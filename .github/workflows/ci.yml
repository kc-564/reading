name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: |
          mkdir -p ci-logs
          if ./gradlew assembleDebug --no-daemon > ci-logs/build.log 2>&1; then
            echo "BUILD_EXIT=0" >> ci-logs/status.txt
          else
            ec=$?
            echo "BUILD_EXIT=$ec" >> ci-logs/status.txt
            echo "===== BUILD LOG (tail) ====="
            tail -n 120 ci-logs/build.log
            exit $ec
          fi

      - name: Run unit tests
        run: |
          mkdir -p ci-logs
          if ./gradlew testDebugUnitTest --no-daemon > ci-logs/test.log 2>&1; then
            echo "TEST_EXIT=0" >> ci-logs/status.txt
          else
            ec=$?
            echo "TEST_EXIT=$ec" >> ci-logs/status.txt
            echo "===== TEST LOG (tail) ====="
            tail -n 120 ci-logs/test.log
            exit $ec
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install chardet
          if [ -f tools/requirements.txt ]; then pip install -r tools/requirements.txt; fi

      - name: Run TOC rule validation
        run: python tools/toc_validate.py

      - name: Publish CI report (logs + APK) via git
        if: always()
        run: |
          set -x
          PUB=/tmp/ci-publish
          rm -rf "$PUB"
          mkdir -p "$PUB/ci-logs" "$PUB/apk"
          cp -r ci-logs/. "$PUB/ci-logs/" 2>/dev/null || echo "no ci-logs produced" > "$PUB/ci-logs/.none"
          echo "RUN_ID=${GITHUB_RUN_ID}"        > "$PUB/run.json"
          echo "SHA=${GITHUB_SHA}"             >> "$PUB/run.json"
          echo "REF=${GITHUB_REF}"             >> "$PUB/run.json"
          echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$PUB/run.json"
          # include APK if it exists (build succeeded)
          shopt -s nullglob
          for f in app/build/outputs/apk/debug/*.apk; do
            cp "$f" "$PUB/apk/"
          done
          if [ -z "$(ls -A "$PUB/apk" 2>/dev/null)" ]; then
            echo "no apk produced" > "$PUB/apk/.none"
          fi
          cd "$PUB"
          git init -q
          git config user.email "ci@github.com"
          git config user.name "ci-bot"
          git add -A
          git commit -q -m "ci report ${GITHUB_SHA} run ${GITHUB_RUN_ID}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/kc-564/reading.git"
          git push -f origin HEAD:ci-reports
